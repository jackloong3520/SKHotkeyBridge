name: Build Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release 标签名"
        required: true
        default: "v1.0.0"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build
        run: >
          pyinstaller --noconfirm --clean --noupx --onefile --noconsole
          --name SKHotkeyBridge --distpath dist --workpath build SKHotkeyBridge.py

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item dist\SKHotkeyBridge.exe release\
          Copy-Item SKHotkeyBridge.ini release\
          Copy-Item README.md release\使用说明.md
          $hash = (Get-FileHash release\SKHotkeyBridge.exe -Algorithm SHA256).Hash
          Set-Content -Path release\SHA256.txt -Value $hash
          Get-Content release\SHA256.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SKHotkeyBridge-windows
          path: release/

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: release/*
          generate_release_notes: true
