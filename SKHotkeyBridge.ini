; SKHotkeyBridge 配置文件
; 修改后，在托盘区右键“对拷线快捷键桥接”并选择“重新载入配置”。
; 快捷键留空即表示不启用，例如 KeyboardMouse=

[Hotkeys]
; 一键同步开关：同时控制“鼠标键盘控制”和“剪贴簿分享”
; 规则：只要有一项是开启的就全部关闭；全部关闭时按一次则全部开启。
Both=CTRL+ALT+F11

; 单独切换鼠标键盘控制
KeyboardMouse=CTRL+ALT+F9

; 单独切换剪贴簿分享
Clipboard=CTRL+ALT+F10

[General]
; true 时，每次切换后显示 Windows 通知；false 时静默切换。
ShowFeedback=false

; true 时，程序启动后显示一次通知。
ShowStartupNotice=false

[Target]
; 以下参数已按原版 Mac KM Link 1.0.1325.47 实测定位。
WindowClass=SmartKMCCableWinClass
ProcessName=MacKMLink.exe
KeyboardMouseCommand=32776
ClipboardCommand=32777

; 读取状态时用于程序化弹出托盘菜单的内部消息号与图标编号。
TrayMessage=0x8001
TrayIconId=0

[State]
; auto = 先从原程序托盘菜单读取真实状态，再决定要发送哪些命令（推荐）。
; off  = 不读状态，直接把两项各切换一次（不需要弹出菜单，但两者可能不同步）。
Detection=auto

; true = 读取状态时把菜单移到屏幕外，避免一闪而过。
HideProbeMenu=true

; true = 发送命令后再次读取状态进行校验。
VerifyAfterCommand=true

; 菜单文字中判断“当前为开启”的原文（程序语言不同时需要调整）。
KeyboardMouseOnText=暂时关闭鼠标键盘控制
KeyboardMouseOffText=开启鼠标键盘控制
ClipboardOnText=暂时关闭剪贴簿分享
ClipboardOffText=开启剪贴簿分享
